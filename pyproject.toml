[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "vpn-reality-client"
version = "0.1.0"
description = "Desktop MVP client for VLESS + Reality (xray-core)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "vpn-reality-client contributors" }]
dependencies = [
    "typer>=0.12",
    "pydantic>=2.0",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "httpx>=0.27",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
vpn-reality = "vpn_client.cli:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["vpn_client*"]

[tool.setuptools.package-data]
vpn_client = ["../web/static/*"]
